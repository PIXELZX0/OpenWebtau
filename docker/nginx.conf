server {
    listen 80;
    root /usr/share/nginx/html;

    # Blazor publish ships .gz next to every asset.
    gzip_static on;

    # Client-side routes (/edit/{id}) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Projects and voicebanks, on the /data volume. store.js reads and writes
    # these with plain GET/PUT/DELETE and lists them as JSON.
    # No auth: anyone who can reach this port can read and change the data.
    location /data/ {
        root /;
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1g;
        # Same filesystem as the data, so a finished upload is a rename, not a copy.
        client_body_temp_path /data/.tmp;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # MCP server (mcp/server.mjs --http): agents connect to POST /mcp, and the
    # editor long-polls /mcp/poll for their calls. Same auth caveat as /data.
    location /mcp {
        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        # The server checks Origin against the host the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        # wav export renders the whole song; the server gives up at 120 s.
        proxy_read_timeout 150s;
    }
}
