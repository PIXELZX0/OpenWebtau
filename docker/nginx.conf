# Failed passwords are the only thing worth throttling: 10 login posts a minute
# per address. GET maps to "" and is not counted.
map $request_method $login_limit {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit zone=login:1m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Blazor publish ships .gz next to every asset.
    gzip_static on;

    # Everything needs a session cookie (or, for /<key>/mcp, the key). The
    # password is set by whoever opens the page first; see docker/auth.mjs.
    auth_request /auth/check;

    # Client-side routes (/edit/{id}) fall back to the app shell. Page loads
    # without a session go to the login form; fetches just get 401.
    location / {
        error_page 401 = @login;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
    }
    location @login {
        return 302 /auth/login;
    }

    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:5179;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location /auth/ {
        auth_request off;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5179;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Projects and voicebanks, on the /data volume. store.js reads and writes
    # these with plain GET/PUT/DELETE and lists them as JSON.
    location /data/ {
        root /;
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1g;
        # Same filesystem as the data, so a finished upload is a rename, not a copy.
        client_body_temp_path /data/.tmp;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
    # /data/.auth (password hash, MCP key) and /data/.tmp are not data.
    location /data/. {
        return 404;
    }

    # MCP server (mcp/server.mjs --http). Agents POST to /<key>/mcp, which
    # auth.mjs checks against the key; the editor long-polls /mcp/poll with its
    # session cookie.
    location ~ "^/[\w-]{43}/mcp$" {
        rewrite ^ /mcp break;
        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
    location /mcp/ {
        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        # The server checks Origin against the host the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        # wav export renders the whole song; the server gives up at 120 s.
        proxy_read_timeout 150s;
    }
}
