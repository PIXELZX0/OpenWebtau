server {
    listen 80;
    root /usr/share/nginx/html;

    # Blazor publish ships .gz next to every asset.
    gzip_static on;
    # Client-side routes (/edit/{id}) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
